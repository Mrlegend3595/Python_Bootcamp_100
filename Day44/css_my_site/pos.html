    <!-- Display Property:
    Block = تمام عرض صفحه در یک پیج سایت را اشغال میکند. عملا مانع نشتن عنصری در سمت چپ یا راست میشود .
            <p> - <h1> to <h6> - <div> - <ol>,<ul>,<li> - <form>
    Inline = یک نمایش درون خطی عنصر که فقط به اندازه ارتفاع و عرضش فضای لازم را اشغال میکند .
            <span> - <img> - <a>
    inline-Block = اگه هم بخوام عرض رو تغییر بدم هم متن هارو که پاراگراف یا . .. هسنتد رو داخل یک خط

    None= جوری عنصر رر محو میکنهیا کلا حذف میکه

    <!--
     Position property:

     1.static = استاتیک به معنای همراهی با قوانین html و پیشفرض است
     2.relative position = موقعیت نسبی میاد از موقیت پیش فرض به موقعیت های جدید میبره
                          درپایین مثلا عکس رو 30 پیکسل از لبه سمت چپ فاصله میده
        img{
            position: relative
            left: 30 px}
     3.coordinates: top,bottom,left,right

     یه سری نکات :
     وقتی میخواهید یه عنصر رو حرکت بدید که موقعیت نسبی از قبل داشته
